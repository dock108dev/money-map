name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  UV_VERSION: "0.9.10"
  PNPM_VERSION: "10.9.0"

jobs:
  source:
    name: source
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure ephemeral runtime
        run: |
          sudo install -d -m 1777 /private/tmp
          install -d -m 700 "$RUNNER_TEMP/paycheck-map-ci"
          echo "PAYCHECK_MAP_LOCAL_DIR=$RUNNER_TEMP/paycheck-map-ci" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install locked dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          uv sync --python 3.12 --all-extras --locked

      - name: Run complete source gate
        run: uv run --locked --python 3.12 paycheck-map verify

      - name: Build Python distribution
        run: uv build --python 3.12

  native:
    name: native-macos
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/src-tauri

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --check

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build locked frontend assets
        run: |
          pnpm --dir ../../web install --frozen-lockfile
          pnpm --dir ../../web build

      - name: Create non-release sidecar fixture
        run: |
          install -d binaries
          install -m 755 /dev/null "binaries/money-map-sidecar-$(rustc --print host-tuple)"

      - name: Lint native targets
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test native runtime
        run: cargo test --locked
